name: Alovera Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Alovera APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks
          chmod 600 android/app/my-release-key.jks

      - name: Verify Keystore
        run: |
          echo "=== Keystore file ==="
          ls -lh android/app/my-release-key.jks

          echo "=== Keystore type ==="
          file android/app/my-release-key.jks

          echo "=== Checking keystore ==="
          keytool -list \
            -keystore android/app/my-release-key.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}"


      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=app/my-release-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Verify Signing Configuration
        run: |
          echo "=== key.properties ==="
          sed 's/storePassword=.*/storePassword=***MASKED***/; s/keyPassword=.*/keyPassword=***MASKED***/' android/key.properties

          echo "=== Keystore ==="
          ls -lh android/app/my-release-key.jks

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Verify Release APK
        run: |
          echo "=== APK SIGNATURE ==="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Verify Release AAB
        run: |
          echo "=== AAB SIGNATURE ==="
          jarsigner -verify -verbose -certs \
            android/app/build/outputs/bundle/release/app-release.aab | tail -20

      - name: Prepare APK and AAB
        run: |
          mkdir -p output

          cp android/app/build/outputs/apk/debug/app-debug.apk \
            output/Alovera-debug.apk

          cp android/app/build/outputs/apk/release/app-release.apk \
            output/Alovera-release.apk

          cp android/app/build/outputs/bundle/release/app-release.aab \
            output/Alovera-release.aab

          echo "=== Generated files ==="
          ls -lh output

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Alovera-Android
          path: output/

      - name: Clean signing files
        if: always()
        run: |
          rm -f android/app/my-release-key.jks
          rm -f android/key.properties
